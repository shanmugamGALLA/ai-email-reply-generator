<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container" style="width: 600px;">

    <h1>AI Email Reply Generator</h1>

    <textarea id="emailText" placeholder="Paste received email..." rows="6" style="width:100%;"></textarea>
    <br><br>

    <select id="tone">
        <option value="formal">Formal</option>
        <option value="friendly">Friendly</option>
        <option value="professional">Professional</option>
    </select>

    <br><br>

    <button onclick="generateReply()" class="btn">Generate Reply</button>

    <h3>AI Response:</h3>
    <p id="output"></p>

</div>

<script src="js/main.js"></script>

</body>
</html>
